[package]
name = "tun2proxy"
version = "0.9.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tun2proxy/tun2proxy"
homepage = "https://github.com/tun2proxy/tun2proxy"
authors = ["B. Blechschmidt", "ssrlive"]
description = "Tunnel interface to proxy"
readme = "README.md"
rust-version = "1.90"
default-run = "tun2proxy-bin"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "tun2proxy-bin"
path = "src/bin/main.rs"

[[bin]]
name = "udpgw-server"
path = "src/bin/udpgw_server.rs"
required-features = ["udpgw"]

[features]
default = ["udpgw", "unshare"]
udpgw = []
unshare = ["tokio/process", "bincode-next"]

[dependencies]
async-trait = "0.1.92"
base64easy = "0.1.7"
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
] }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
    "suggestions",
    "wrap_help",
] }
ctrlc2 = { version = "4.0.0", default-features = false, features = [
    "async",
    "termination",
] }
digest_auth = "0.3.1"
dotenvy = "0.15.7"
env_logger = { version = "0.11.11", default-features = false, features = [
    "humantime",
    "color",
    "auto-color",
] }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
hashlink = "0.12.2"
# Includes the bounded name-compression fix for GHSA-q2qq-hmj6-3wpp.
hickory-proto = "=0.26.3"
httparse = "1.10.1"
internet-checksum = "0.2.1"
# The sibling fork, which carries TCP and UDP fixes not yet upstream. No version
# requirement, so the fork keeps the upstream pre-release version.
ipstack = { path = "../ipstack" }
log = { version = "0.4.34", default-features = false, features = [
    "std",
    "serde",
] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
socks5-impl = { version = "0.10.3", default-features = false, features = [
    "protocol",
    "tokio",
    "serde",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "sync",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tproxy-config = { version = "^7.0.9", default-features = false }
tun = { version = "0.8.14", features = ["async"] }
unicase = "2.10.0"
url = "2.5.8"

[target.'cfg(target_os="android")'.dependencies]
android_logger = "0.15.1"
jni = { version = "0.22.4", default-features = false }

[target.'cfg(target_os="linux")'.dependencies]
bincode-next = { version = "3.1.1", optional = true }
tokio = { version = "1.54.0", default-features = false, optional = true, features = [
    "process",
] }

# Process-based bypass feature (`--bypass-process`): only built on the platforms
# that implement source-process lookup and physical-interface binding. Keeping
# these here avoids pulling them (and breaking the build) on iOS/Android, where
# the platform VPN API owns per-application routing instead.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
netstat2 = "0.11.2"
socket2 = "0.6.5"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
netdev = "0.46.3"

[target.'cfg(target_os="windows")'.dependencies]
# Gateway MAC discovery sends synchronous ARP probes, including to TUN portals.
# Route selection and DNS only need passive IP Helper snapshots on Windows.
netdev = { version = "0.46.3", default-features = false }
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
daemonize = "0.5.0"
nix = { version = "0.31.3", default-features = false, features = [
    "fs",
    "socket",
    "uio",
] }

[build-dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["test-util"] }

# [profile.release]
# strip = "symbols"
