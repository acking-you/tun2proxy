[package]
name = "tun2proxy"
version = "0.9.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tun2proxy/tun2proxy"
homepage = "https://github.com/tun2proxy/tun2proxy"
authors = ["B. Blechschmidt", "ssrlive"]
description = "Tunnel interface to proxy"
readme = "README.md"
rust-version = "1.85"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "tun2proxy-bin"
path = "src/bin/main.rs"

[[bin]]
name = "udpgw-server"
path = "src/bin/udpgw_server.rs"
required-features = ["udpgw"]

[features]
default = ["udpgw"]
udpgw = []

[dependencies]
async-trait = "0.1.89"
base64easy = "0.1.7"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "wrap_help", "color"] }
ctrlc2 = { version = "4.0.0", features = ["async", "termination"] }
digest_auth = "0.3.1"
dotenvy = "0.15.7"
env_logger = "0.11.10"
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
hashlink = "0.12.0"
# Keep the DNS wire API aligned with embedders that still use the 0.26 alpha
# resolver API. Cargo otherwise unifies both dependencies on stable 0.26 and
# breaks those embedders at compile time.
hickory-proto = "=0.26.0-alpha.1"
httparse = "1.10.1"
ipstack = { version = "1.0.0" }
log = { version = "0.4.30", features = ["std"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shlex = "2.0.1"
socks5-impl = { version = "0.8.3", default-features = false, features = [
    "tokio",
    "serde",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tproxy-config = { version = "^7.0.7", default-features = false }
tun = { version = "0.8.10", features = ["async"] }
udp-stream = { version = "0.0.12", default-features = false }
unicase = "2.9.0"
url = "2.5.8"

[target.'cfg(target_os="android")'.dependencies]
android_logger = "0.15.1"
jni = { version = "0.22.4", default-features = false }

[target.'cfg(target_os="linux")'.dependencies]
bincode-next = "2.1.0"

# Process-based bypass feature (`--bypass-process`): only built on the platforms
# that implement source-process lookup and physical-interface binding. Keeping
# these here avoids pulling them (and breaking the build) on iOS/macOS/Android.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
netdev = "0.44.0"
netstat2 = "0.11.2"
socket2 = "0.6.4"

[target.'cfg(target_os="windows")'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
daemonize = "0.5.0"
nix = { version = "0.31.3", default-features = false, features = [
    "fs",
    "socket",
    "uio",
] }

[build-dependencies]
chrono = "0.4.44"
serde_json = "1.0.150"

# [profile.release]
# strip = "symbols"
