name: Push or PR

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  build_n_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-ipstack
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-01-26
          components: clippy, rustfmt

      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: check
        if: ${{ !cancelled() }}
        run: cargo check --verbose --locked

      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --verbose --tests --all-features
          cargo clean
          cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --all-features

  build_n_test_android:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-ipstack
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-01-26
          components: clippy, rustfmt
      - name: Install cargo ndk and rust compiler for android target
        if: ${{ !cancelled() }}
        run: |
          cargo +stable install --locked cargo-ndk
          rustup target add x86_64-linux-android
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo ndk -t x86_64 clippy --locked --all-features -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo ndk -t x86_64 rustc --locked --verbose --all-features --lib --crate-type=cdylib

  build_n_test_ios:
    strategy:
      fail-fast: false
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-ipstack
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-01-26
          components: clippy, rustfmt
      - name: Install rust compiler for iOS targets
        if: ${{ !cancelled() }}
        run: |
          rustup target add x86_64-apple-ios aarch64-apple-ios
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --target x86_64-apple-ios --all-features -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --target aarch64-apple-ios --lib --all-features
          cargo build --locked --target x86_64-apple-ios --lib --all-features

  semver:
    name: Check semver
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-ipstack
      - uses: dtolnay/rust-toolchain@stable
      - name: Check semver
        if: ${{ !cancelled() }}
        uses: obi1kenobi/cargo-semver-checks-action@v2
